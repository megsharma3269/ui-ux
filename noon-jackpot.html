<title>noon Jackpot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: dark;
  font-family: system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

body {
  background: #0a0a0a;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Phone frame */
.phone {
  width: 393px;
  height: 852px;
  position: relative;
  overflow: hidden;
  border-radius: 44px;
  /* Background: gradient from brown-black, matching paint0 */
  background: linear-gradient(to bottom, #000 0%, #2d1e10 50%, #5C3C20 100%);
}

/* Geometric diamond pattern overlay */
.geo-pattern {
  position: absolute;
  inset: 0;
  opacity: 0.08;
  z-index: 1;
  background:
    linear-gradient(45deg, #BCBCBC 1px, transparent 1px),
    linear-gradient(-45deg, #BCBCBC 1px, transparent 1px),
    linear-gradient(135deg, #BCBCBC 1px, transparent 1px),
    linear-gradient(-135deg, #BCBCBC 1px, transparent 1px);
  background-size: 40px 40px;
  background-position: 0 0, 0 0, 20px 20px, 20px 20px;
}

/* Status bar */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 54px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 32px 0;
  z-index: 20;
  font-size: 15px;
  font-weight: 700;
}
.status-icons { display: flex; gap: 6px; align-items: center; }
.battery { width: 27px; height: 13px; border: 1.5px solid #fff; border-radius: 3px; position: relative; padding: 1.5px; }
.battery::after { content: ''; position: absolute; right: -5px; top: 3px; width: 2px; height: 5px; background: #fff; border-radius: 0 1px 1px 0; }
.battery-fill { width: 100%; height: 100%; background: #fff; border-radius: 1px; }

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 25;
}

/* Close button */
.close-btn {
  position: absolute;
  top: 60px; right: 20px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.5);
  background: transparent;
  color: rgba(255,255,255,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  cursor: pointer;
  z-index: 15;
}

/* noon text - using the actual SVG paths */
.noon-header {
  position: absolute;
  top: 68px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  z-index: 10;
}

/* JACKPOT image */
.jackpot-img {
  position: absolute;
  top: 128px;
  left: 50%;
  transform: translateX(-50%);
  width: 345px;
  z-index: 10;
  image-rendering: auto;
  filter: drop-shadow(0 6px 0 rgba(0,0,0,0.9));
}

/* Coin gems - using the exact gold gradients from the design */
.coin-gems {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
}
.gem {
  position: absolute;
  border-radius: 40%;
  transform: rotate(var(--rot));
  animation: gemFloat var(--dur) var(--delay) infinite ease-in-out;
  filter: blur(var(--blur, 0px));
}
.gem-inner {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(135deg, #3F3806, #F1DF0B 60%, #4B4500);
  box-shadow: inset 0 1px 3px rgba(241,223,11,0.5);
}
@keyframes gemFloat {
  0%, 100% { transform: rotate(var(--rot)) translateY(0); opacity: var(--o); }
  50% { transform: rotate(var(--rot)) translateY(-12px); opacity: 1; }
}

/* Slot machine */
.machine {
  position: absolute;
  top: 218px;
  left: 50%;
  transform: translateX(-50%);
  width: 352px;
  z-index: 5;
}

/* Machine outer frame - gold gradient border matching paint1 */
.machine-frame {
  background: linear-gradient(to top, #806800, #DFCD4B 38%, #EFFF00 47%, #E6E22C 54%, #7E6800);
  border-radius: 32px;
  padding: 12px;
  position: relative;
}

/* Inner dark body */
.machine-body {
  background: #0F0F0F;
  border-radius: 22px;
  padding: 18px 14px 14px;
  position: relative;
}

/* Yellow corner arcs - top-left and top-right */
.corner-arc {
  position: absolute;
  width: 70px;
  height: 50px;
  border: 10px solid #EBE60C;
  z-index: 2;
}
.corner-arc-tl {
  top: -2px; left: -2px;
  border-radius: 32px 0 0 0;
  border-right: none;
  border-bottom: none;
}
.corner-arc-tr {
  top: -2px; right: -2px;
  border-radius: 0 32px 0 0;
  border-left: none;
  border-bottom: none;
}

/* Corner dots */
.corner-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #291D3F;
  z-index: 3;
}

/* Slot window - orange border matching the design */
.slot-window {
  border: 5px solid #FF7600;
  border-radius: 28px;
  overflow: hidden;
  height: 282px;
  position: relative;
  background: linear-gradient(to bottom, #000 20%, #1C1C1C 51%, #000 80%);
}

/* Orange play triangles */
.play-triangle {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 0; height: 0;
  z-index: 3;
}
.play-triangle-left {
  left: -4px;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-left: 18px solid #FF7600;
}
.play-triangle-right {
  right: -4px;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-right: 18px solid #FF7600;
}

/* Light dots row */
.light-dots {
  position: absolute;
  bottom: -16px;
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 8px;
  z-index: 4;
}
.light-dot-row {
  display: flex;
  gap: 1px;
  width: 100%;
  justify-content: center;
}
.light-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #EBE60C;
  box-shadow: 0 4px 2px rgba(0,0,0,0.9);
  flex-shrink: 0;
  animation: dotBlink 0.8s infinite alternate;
}
.light-dot:nth-child(odd) { animation-delay: 0.4s; }
@keyframes dotBlink {
  0% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* Dashed line separator */
.dash-line {
  position: absolute;
  left: 10px; right: 10px;
  height: 1px;
  background: repeating-linear-gradient(90deg, #EBE60C, #EBE60C 4px, transparent 4px, transparent 8px);
  bottom: 0;
  z-index: 2;
}

/* Slot reel */
.slot-reel {
  position: absolute;
  top: 0; left: 0; right: 0;
  transition: transform 0.1s;
}

.prize-row {
  height: 94px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 24px;
  position: relative;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.prize-row::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 24px; right: 24px;
  height: 1px;
  background: #EFEFEF;
  opacity: 0.5;
}
.prize-row:last-child::after { display: none; }

.prize-title {
  font-weight: 800;
  font-size: 17px;
  line-height: 1.2;
  color: #636363;
  text-align: center;
}
.prize-subtitle {
  font-weight: 600;
  font-size: 12px;
  color: #636363;
  line-height: 1.2;
  text-align: center;
}

/* Middle row highlighted */
.prize-row.highlight .prize-title {
  color: #000;
  font-size: 18px;
}
.prize-row.highlight .prize-subtitle {
  color: #000;
}
.prize-row.highlight {
  background: rgba(255,255,255,0.08);
}

/* Spinning state */
.slot-window.spinning .slot-reel {
  animation: slotSpin 0.12s linear infinite;
}
@keyframes slotSpin {
  0% { transform: translateY(0); }
  100% { transform: translateY(-94px); }
}

/* Win state */
.prize-row.winner {
  background: #EBE60C;
}
.prize-row.winner .prize-title {
  color: #cc0000;
  font-size: 19px;
}
.prize-row.winner .prize-subtitle {
  color: #cc0000;
  font-size: 13px;
}
.prize-row.winner::after { display: none; }

.machine-frame.won {
  box-shadow: 0 0 40px rgba(235,230,12,0.5);
  animation: framePulse 0.5s ease-in-out 3;
}
@keyframes framePulse {
  0%, 100% { box-shadow: 0 0 20px rgba(235,230,12,0.3); }
  50% { box-shadow: 0 0 50px rgba(235,230,12,0.7); }
}

/* Bottom gold section */
.bottom-gold {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 268px;
  background: linear-gradient(to bottom, #EBE60C 0%, #000 100%);
  z-index: 5;
}

/* Curved connector from machine to bottom */
.bottom-curve {
  position: absolute;
  top: -24px;
  left: 0; right: 0;
  height: 70px;
  z-index: 1;
}
.bottom-curve svg {
  width: 100%;
  height: 100%;
}

/* Turns counter pill */
.turns-pill {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #232323;
  border: 1px solid #5B5900;
  color: #EBE60C;
  font-weight: 700;
  font-size: 11px;
  padding: 6px 24px;
  border-radius: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 6;
  white-space: nowrap;
}

/* HIT HERE button */
.hit-btn {
  position: absolute;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 64px;
  background: #0F0F0F;
  border: none;
  border-radius: 50px;
  color: #EBE60C;
  font-family: system-ui, -apple-system, sans-serif;
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 4px;
  text-transform: uppercase;
  cursor: pointer;
  z-index: 6;
  box-shadow: 0 6px 0 rgba(63,56,6,0.8);
  transition: transform 0.1s, box-shadow 0.1s;
  position: relative;
}
.hit-btn:active {
  transform: translateX(-50%) translateY(3px);
  box-shadow: 0 3px 0 rgba(63,56,6,0.8);
}
.hit-btn.spinning {
  opacity: 0.5;
  pointer-events: none;
}

/* Details link */
.details-link {
  position: absolute;
  top: 170px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: #333;
  border: 1px solid #666;
  border-radius: 14px;
  padding: 4px 16px;
  text-decoration: none;
  font-weight: 500;
  z-index: 6;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Home indicator */
.home-indicator {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: #000;
  border-radius: 100px;
  z-index: 20;
}

/* Confetti */
.confetti {
  position: absolute;
  z-index: 30;
  pointer-events: none;
  animation: confettiFall var(--dur) var(--delay) ease-in forwards;
  opacity: 0;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(900px) rotate(720deg); opacity: 0.3; }
}

@media (max-width: 420px) {
  .phone {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
  }
}
</style>

  ];
  gems.forEach((g, i) => {
    const el = document.createElement('div');
    el.className = 'gem';
    el.innerHTML = '<div class="gem-inner"></div>';
    el.style.cssText = \`left:\${g.x}%;top:\${g.y}%;width:\${g.w}px;height:\${g.h}px;--rot:\${g.rot}deg;--blur:\${g.blur}px;--o:\${g.o};--dur:\${g.dur}s;--delay:\${i*0.3}s\`;
    container.appendChild(el);
  });
}

function createLightDots() {
  const row = document.getElementById('lightDots');
  for (let i = 0; i < 32; i++) {
    const dot = document.createElement('div');
    dot.className = 'light-dot';
    row.appendChild(dot);
  }
}

function buildReel(winIndex) {
  const reel = document.getElementById('slotReel');
  reel.innerHTML = '';
  const extended = [];
  for (let i = 0; i < 30; i++) {
    extended.push(prizes[i % prizes.length]);
  }
  if (winIndex !== undefined) {
    extended[27] = prizes[winIndex];
  }
  extended.forEach((prize, i) => {
    const row = document.createElement('div');
    row.className = 'prize-row';
    row.innerHTML = '<div class="prize-title">' + prize.title + '</div><div class="prize-subtitle">' + prize.subtitle + '</div>';
    reel.appendChild(row);
  });
}

function spin() {
  if (isSpinning || turnsLeft <= 0) return;
  isSpinning = true;
  turnsLeft--;
  document.getElementById('turnsCount').textContent = turnsLeft;

  const btn = document.getElementById('hitBtn');
  const slotWindow = document.getElementById('slotWindow');
  const machineFrame = document.getElementById('machineFrame');
  const reel = document.getElementById('slotReel');

  btn.classList.add('spinning');
  machineFrame.classList.remove('won');

  const winIndex = Math.floor(Math.random() * prizes.length);
  buildReel(winIndex);

  slotWindow.classList.add('spinning');
  reel.style.transition = 'none';
  reel.style.transform = 'translateY(0)';

  const spinDuration = 2000 + Math.random() * 1000;

  setTimeout(function() {
    slotWindow.classList.remove('spinning');
    var targetRow = 27;
    var offset = -(targetRow * 94) + 94;
    reel.style.transition = 'transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1)';
    reel.style.transform = 'translateY(' + offset + 'px)';

    setTimeout(function() {
      showWinState(winIndex);
      btn.classList.remove('spinning');
      isSpinning = false;

      if (turnsLeft <= 0) {
        btn.textContent = 'NO TURNS LEFT';
        btn.style.opacity = '0.4';
        btn.style.cursor = 'default';
        btn.style.fontSize = '20px';
      }
    }, 1300);
  }, spinDuration);
}

function showWinState(winIndex) {
  var machineFrame = document.getElementById('machineFrame');
  machineFrame.classList.add('won');

  var reel = document.getElementById('slotReel');
  var rows = reel.querySelectorAll('.prize-row');
  var winRow = rows[27];
  if (winRow) winRow.className = 'prize-row winner';

  launchConfetti();
}

function launchConfetti() {
  var phone = document.querySelector('.phone');
  var colors = ['#EBE60C', '#FF7600', '#F1DF0B', '#fff', '#DFCD4B', '#CEBB11'];
  for (var i = 0; i < 35; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti';
    var size = 4 + Math.random() * 8;
    piece.style.cssText = 'left:' + (Math.random()*100) + '%;top:-10px;width:' + size + 'px;height:' + size + 'px;background:' + colors[Math.floor(Math.random()*colors.length)] + ';border-radius:' + (Math.random()>0.5?'50%':'2px') + ';--dur:' + (1.5+Math.random()*2) + 's;--delay:' + (Math.random()*0.5) + 's';
    phone.appendChild(piece);
    setTimeout(function(el){el.remove()}, 4000, piece);
  }
}

createGems();
createLightDots();
buildReel();
document.getElementById('slotReel').style.transform = 'translateY(0)';
</script>
