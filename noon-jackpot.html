<title>Noon Jackpot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Inter:wght@600;700;800;900&display=swap">
<style>
  :root {
    --bg-dark: #1c1208;
    --bg-yellow: #f5d800;
    --gold: #ffd700;
    --gold-dark: #b8960f;
    --orange: #ff6a00;
    --red: #cc1100;
    --red-muted: rgba(180,40,30,0.7);
    --text: #fff;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { color-scheme: dark; }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    position: relative;
  }

  /* Two-tone background: dark top, yellow bottom */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(to bottom, var(--bg-dark) 0%, var(--bg-dark) 55%, #c4a800 58%, var(--bg-yellow) 62%, var(--bg-yellow) 100%);
  }

  /* Coin scene layer */
  .coin-scene {
    position: fixed; inset: 0; z-index: 1;
    perspective: 800px;
    pointer-events: none;
    overflow: hidden;
  }

  /* 3D Coins */
  .coin {
    position: absolute;
    width: var(--sz);
    height: var(--sz);
    border-radius: 50%;
    background: radial-gradient(ellipse at 30% 30%, #fff8b0, #ffd700 35%, #b8960f 75%, #6b4e00);
    box-shadow: inset 0 -2px 5px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.3);
    animation: coinDepth var(--dur) var(--del) infinite ease-in-out;
    transform-style: preserve-3d;
  }
  .coin::after {
    content: 'n';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 900;
    font-size: calc(var(--sz) * 0.4);
    color: rgba(120,90,0,0.5);
  }

  @keyframes coinDepth {
    0%   { transform: translateZ(var(--z0)) rotateY(0deg)   scale(var(--s0)); opacity: var(--o0); }
    50%  { transform: translateZ(var(--z1)) rotateY(180deg) scale(var(--s1)); opacity: var(--o1); }
    100% { transform: translateZ(var(--z0)) rotateY(360deg) scale(var(--s0)); opacity: var(--o0); }
  }

  /* Page content */
  .page {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* Close button */
  .close {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.6);
    font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }

  /* Header: noon + JACKPOT */
  .header {
    text-align: center;
    margin-top: clamp(10px, 3vh, 30px);
    position: relative;
  }

  .noon {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(3rem, 13vw, 5rem);
    color: var(--gold);
    text-shadow: 0 3px 0 #a07800, 0 6px 0 #705200, 0 0 20px rgba(255,215,0,0.4);
    line-height: 0.9;
    letter-spacing: 0.05em;
  }

  .jackpot {
    font-family: 'Oswald', sans-serif;
    font-weight: 900;
    font-size: clamp(3.5rem, 16vw, 6.5rem);
    line-height: 0.85;
    letter-spacing: 0.03em;
    color: var(--red);
    text-shadow:
      0 0 2px #ff0,
      1px 1px 0 #ff0,
      -1px -1px 0 #ff0,
      2px 0 0 #ff0,
      -2px 0 0 #ff0,
      0 2px 0 #ff0,
      0 -2px 0 #ff0;
    -webkit-text-stroke: 1px #cc8800;
    position: relative;
  }

  /* Slot machine */
  .machine-wrap {
    margin-top: clamp(8px, 2vh, 20px);
    position: relative;
    width: min(88vw, 360px);
  }

  /* Gold base/pedestal */
  .machine-base {
    position: absolute;
    bottom: -30px; left: 50%; transform: translateX(-50%);
    width: 110%;
    height: 80px;
    background: linear-gradient(180deg, #e8c800 0%, #c4a200 30%, #a08200 60%, #d4b400 100%);
    border-radius: 0 0 20px 20px;
    clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
    z-index: -1;
  }

  .machine-outer {
    background: #1a1a00;
    border-radius: 16px;
    padding: 14px;
    position: relative;
    border: 3px solid #2a2a00;
  }

  /* Yellow bulb border */
  .bulb-border {
    position: absolute; inset: -6px;
    border-radius: 20px;
    pointer-events: none; z-index: 3;
  }
  .bulb-dot {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 4px rgba(255,215,0,0.6);
  }

  /* Dark screws/rivets at corners */
  .rivet {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, #333 40%, #111 100%);
    z-index: 4;
  }
  .rivet.tl { top: 6px; left: 6px; }
  .rivet.tr { top: 6px; right: 6px; }
  .rivet.bl { bottom: 6px; left: 6px; }
  .rivet.br { bottom: 6px; right: 6px; }

  /* Orange inner border */
  .machine-inner-border {
    border: 4px solid var(--orange);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }

  /* Glass reflection */
  .machine-inner-border::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(155deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 30%, transparent 55%);
    pointer-events: none; z-index: 2;
  }

  .machine-display {
    background: linear-gradient(180deg, #1a1a1a 0%, #111 100%);
    padding: clamp(18px, 4vh, 30px) clamp(16px, 5vw, 30px);
    display: flex; flex-direction: column; align-items: center; gap: 0;
    position: relative;
  }

  .prize-row {
    text-align: center;
    padding: clamp(14px, 3vh, 22px) 0;
    width: 100%;
  }

  .divider {
    width: 75%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }

  .prize-text {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.25;
    letter-spacing: 0.06em;
  }

  .prize-text.muted-red {
    color: var(--red-muted);
    font-size: clamp(0.85rem, 3.2vw, 1.05rem);
  }

  .prize-text.bold-white {
    color: #fff;
    font-size: clamp(1.3rem, 5vw, 1.7rem);
    font-weight: 900;
    text-shadow: 0 1px 8px rgba(255,255,255,0.15);
  }

  /* Orange side arrows */
  .arrow {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    z-index: 3;
  }
  .arrow-l { left: -4px; border-right: 18px solid var(--orange); }
  .arrow-r { right: -4px; border-left: 18px solid var(--orange); }

  /* Turns badge */
  .turns {
    margin-top: clamp(28px, 5vh, 50px);
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text);
    background: rgba(30,30,30,0.85);
    padding: 8px 28px;
    border-radius: 30px;
  }

  /* HIT HERE button */
  .hit-btn {
    margin-top: clamp(16px, 3vh, 30px);
    width: min(88vw, 360px);
    padding: clamp(16px, 3vh, 22px);
    border-radius: 50px;
    border: 3px solid var(--gold);
    background: #111;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .hit-btn:active { transform: scale(0.97); }

  /* Details link */
  .details-link {
    margin-top: clamp(10px, 2vh, 18px);
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(50,50,50,0.8);
    border: 1.5px solid rgba(50,50,50,0.5);
    padding: 4px 18px;
    border-radius: 20px;
    background: none;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .coin { animation: none !important; }
  }
</style>

<div class="bg"></div>

<div class="coin-scene" id="coinScene"></div>

<div class="page">
  <button class="close" aria-label="Close">&#x2715;</button>

  <div class="header">
    <div class="noon">noon</div>
    <div class="jackpot">JACKPOT</div>
  </div>

  <div class="machine-wrap">
    <div class="machine-base"></div>
    <div class="machine-outer">
      <div class="bulb-border" id="bulbBorder"></div>
      <div class="rivet tl"></div>
      <div class="rivet tr"></div>
      <div class="rivet bl"></div>
      <div class="rivet br"></div>

      <div class="machine-inner-border">
        <div class="arrow arrow-l"></div>
        <div class="arrow arrow-r"></div>
        <div class="machine-display">
          <div class="prize-row">
            <div class="prize-text muted-red">FREE DELIVERY<br>ON NEXT 3 ORDERS</div>
          </div>
          <div class="divider"></div>
          <div class="prize-row">
            <div class="prize-text bold-white">50% OFF<br>ON NEXT ORDER</div>
          </div>
          <div class="divider"></div>
          <div class="prize-row">
            <div class="prize-text muted-red">FREE DELIVERY<br>ON NEXT 3 ORDERS</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="turns">5 TURNS LEFT</div>

  <button class="hit-btn">HIT HERE</button>

  <button class="details-link">Details</button>
</div>

<script>
  // Place bulb dots around the machine border
  (function placeBulbs() {
    const el = document.getElementById('bulbBorder');
    const outer = el.parentElement;
    const rect = outer.getBoundingClientRect();
    const w = rect.width + 12, h = rect.height + 12;
    const perimeter = 2 * (w + h);
    const count = 36;
    const gap = perimeter / count;

    for (let i = 0; i < count; i++) {
      const d = i * gap;
      let x, y;
      if (d < w) { x = d; y = 0; }
      else if (d < w + h) { x = w; y = d - w; }
      else if (d < 2 * w + h) { x = w - (d - w - h); y = h; }
      else { x = 0; y = h - (d - 2 * w - h); }

      const dot = document.createElement('div');
      dot.className = 'bulb-dot';
      dot.style.left = (x - 5) + 'px';
      dot.style.top = (y - 5) + 'px';
      el.appendChild(dot);
    }
  })();

  // Create 3D perspective coins
  (function createCoins() {
    const scene = document.getElementById('coinScene');
    const coins = [
      // Matching approximate positions from the PDF
      { x: 8,  y: 5,  sz: 50, back: true },
      { x: 18, y: 12, sz: 35, back: false },
      { x: 75, y: 4,  sz: 28, back: true },
      { x: 85, y: 10, sz: 42, back: false },
      { x: 60, y: 8,  sz: 22, back: true },
      { x: 92, y: 18, sz: 18, back: false },
      { x: 5,  y: 22, sz: 24, back: true },
      { x: 50, y: 2,  sz: 15, back: false },
      { x: 30, y: 7,  sz: 20, back: true },
      { x: 70, y: 16, sz: 30, back: false },
      { x: 15, y: 30, sz: 18, back: true },
      { x: 90, y: 28, sz: 25, back: false },
      { x: 40, y: 15, sz: 16, back: true },
      { x: 55, y: 20, sz: 20, back: false },
    ];

    coins.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'coin';
      el.style.left = c.x + '%';
      el.style.top = c.y + '%';
      el.style.setProperty('--sz', c.sz + 'px');
      el.style.setProperty('--dur', (6 + Math.random() * 5) + 's');
      el.style.setProperty('--del', (-Math.random() * 6) + 's');

      if (c.back) {
        el.style.setProperty('--z0', (40 + Math.random() * 80) + 'px');
        el.style.setProperty('--z1', (-150 - Math.random() * 200) + 'px');
        el.style.setProperty('--s0', '1.1');
        el.style.setProperty('--s1', '0.5');
        el.style.setProperty('--o0', '0.95');
        el.style.setProperty('--o1', '0.35');
      } else {
        el.style.setProperty('--z0', (-150 - Math.random() * 200) + 'px');
        el.style.setProperty('--z1', (40 + Math.random() * 80) + 'px');
        el.style.setProperty('--s0', '0.5');
        el.style.setProperty('--s1', '1.1');
        el.style.setProperty('--o0', '0.35');
        el.style.setProperty('--o1', '0.95');
      }

      scene.appendChild(el);
    });
  })();
</script>
